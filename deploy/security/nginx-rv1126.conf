worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=rv1126_admin:1m rate=10r/s;

    # Preserve the factory web page without exposing the management API over HTTP.
    server {
        listen 80;
        server_name _;
        root /oem/www;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /cgi-bin/ {
            gzip off;
            fastcgi_pass unix:/run/fcgiwrap.sock;
            fastcgi_index entry.cgi;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /oem/www/cgi-bin/entry.cgi;
            fastcgi_param SCRIPT_NAME /entry.cgi;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /userdata/rv1126-security/tls/device.crt;
        ssl_certificate_key /userdata/rv1126-security/tls/device.key;
        ssl_protocols TLSv1.2;
        ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!DSS;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:RV1126TLS:2m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        client_max_body_size 128m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location / {
            limit_req zone=rv1126_admin burst=30 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        application live {
            live on;
        }
    }
}
